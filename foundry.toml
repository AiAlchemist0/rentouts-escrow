[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]
# script/DeployEscrow.s.sol records the "sepolia" entry of deployments.json and
# script/DeployAIArbiter.s.sol the "sepoliaAIArbiter" entry and script/DeployEnsWorldGate.s.sol the
# "sepoliaHumanGates" entry (only in a --broadcast / --resume run);
# test/DeployEscrow.t.sol and test/DeployAIArbiter.t.sol check that on scratch copies under cache/.
fs_permissions = [
    { access = "read-write", path = "./deployments.json" },
    { access = "read-write", path = "./cache/deploy-escrow-test" },
    { access = "read-write", path = "./cache/deploy-ai-arbiter-test" },
    { access = "read-write", path = "./cache/deploy-ens-world-gate-test" },
]

# RentEscrow invariant suite (test/RentEscrow.invariant.t.sol): the handler only makes valid
# calls, so any revert is a bug. depth 256, not 64: at 64 up to half the runs never reached
# close / resolve / claim; at 256 every measured run did (afterInvariant: each run settles a lease).
[invariant]
runs = 64
depth = 256
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
