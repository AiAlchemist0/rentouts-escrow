[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]
# script/DeployEscrow.s.sol records the "sepolia" entry of deployments.json (only in a --broadcast /
# --resume run); test/DeployEscrow.t.sol checks that on a scratch copy under cache/.
fs_permissions = [
    { access = "read-write", path = "./deployments.json" },
    { access = "read-write", path = "./cache/deploy-escrow-test" },
]

# RentEscrow invariant suite (test/RentEscrow.invariant.t.sol): the handler only makes valid
# calls, so any revert is a bug.
[invariant]
runs = 64
depth = 64
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
